<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>LabFlow LIS Report Download</title>
  <link href="/vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <style>
    :root { color-scheme: light; --brand:#087e8b; --ink:#18232b; --muted:#65727b; --card:#fff; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Arial,Helvetica,sans-serif; color:var(--ink); background:linear-gradient(135deg,#edf8f9,#f8fbff); }
    main { width:min(100%,580px); } .brand { text-align:center; margin-bottom:20px; } .brand h1 { margin:0; font-size:26px; color:var(--brand); } .brand p { margin:7px 0 0; color:var(--muted); }
    .card { background:var(--card); border:1px solid #dce7e8; border-radius:16px; padding:34px; text-align:center; box-shadow:0 16px 45px #23414a1a; } .icon { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 16px; border-radius:50%; color:var(--brand); background:#e5f5f6; font-size:25px; }
    h2 { margin:0 0 9px; font-size:22px; } .status { color:var(--muted); line-height:1.55; min-height:48px; } .meta { margin:17px 0 24px; font-size:13px; color:var(--muted); }
    button { border:0; border-radius:9px; background:var(--brand); color:#fff; padding:13px 20px; font-size:15px; cursor:pointer; font-weight:700; } button:hover { background:#056773; } button:disabled { cursor:wait; opacity:.68; } .error .icon { background:#fff0f0; color:#ba2525; } .error button { display:none; } footer { text-align:center; color:var(--muted); font-size:13px; margin-top:20px; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><h1>LabFlow LIS</h1><p>Secure laboratory report download</p></div>
    <section class="card" id="report-card" aria-live="polite">
      <div class="icon"><i class="fa-solid fa-file-pdf"></i></div>
      <h2>Your report is ready</h2>
      <p class="status" id="status">Preparing your PDF download…</p>
      <p class="meta" id="meta"></p>
      <button id="download-btn" type="button"><i class="fa-solid fa-download"></i> Download report</button>
    </section>
    <footer>Powered by LabFlow Software</footer>
  </main>
  <script src="/offline-report-download.js"></script>
</body>
</html>
