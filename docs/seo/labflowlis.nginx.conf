server {
    listen 80;
    listen [::]:80;
    server_name labflowlis.com www.labflowlis.com lab.occuhealth.in www.lab.occuhealth.in lab.coqher.in www.lab.coqher.in;

    return 301 https://labflowlis.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.labflowlis.com lab.occuhealth.in www.lab.occuhealth.in lab.coqher.in www.lab.coqher.in;

    ssl_certificate /etc/letsencrypt/live/labflowlis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labflowlis.com/privkey.pem;

    return 301 https://labflowlis.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name labflowlis.com;

    ssl_certificate /etc/letsencrypt/live/labflowlis.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labflowlis.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|avif|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
