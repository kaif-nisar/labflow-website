<!--
  ============================================================================
  REPORT FORMAT 5 — EXECUTIVE CLINICAL DIAGNOSTIC REPORT
  File: private/pages/pages/reportFormat5.html
  ============================================================================
  Highlights:
    - Refined Executive Clinical Standard (#1e3a5f / #2b4c7e / #0f766e)
    - Rectangular Code-128 Specimen Barcode (wide width, slim height)
    - Right header always displays Timestamps + Investigations (Short Names)
    - Centered columns whose cell text is cleanly left-aligned down every row
      plus a strictly aligned vertical H / L indicator rail
    - Compact, customizable Row Spacing (Spacing = 1 -> 0.5px padding)
    - Clean doctor/lab signatures without extra horizontal underline bars
    - Compact footer QR + Page X of Y + offline-safe FontAwesome
  ============================================================================
-->
<div id="oh5PageRoot" class="oh5-page-root">
  <style id="oh5Styles">
    .oh5-page-root {

      background: var(--oh5-canvas-bg);

      padding-bottom: 56px;
      box-sizing: border-box;
      color-scheme: light;

    .oh5-page-root *::after {

    }

    /* ================= COMPACT TOP CONTEXT BAR ================= */

    .oh5-topbar-left {

    .oh5-format-chip {

    .oh5-patient-summary {

      .oh5-topbar-right { flex-wrap: wrap; }

    /* ================= SKELETON LOADER ================= */
    .oh5-skeleton-wrap {
      max-width: 794px;
      margin: 24px auto;
      background: #ffffff;

      flex-direction: column;

      align-items: center;

    }

    .oh5-barcode-box {

      align-items: center;

      flex-shrink: 0;
    }

    .oh5-barcode-img-slot img,

      height: 20px !important;

      color: var(--oh5-navy);
      font-variant-numeric: tabular-nums;
    }

    .oh5-header-grid {
      display: grid;
      grid-template-columns: 0.94fr 1.06fr;
      gap: 0 12px;
      align-items: stretch;
    }

    .oh5-patient-col {

      border-right: 1px solid var(--oh5-border-soft);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .oh5-specimen-col {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 3px;
    }

    .oh5-meta-table { width: 100%; border-collapse: collapse; }

    }

    .oh5-ts-lbl { font-weight: 600; color: var(--oh5-slate); margin-right: 3px; }

    /* Investigations ALWAYS visible cleanly inside Right Section below timestamps */
    .oh5-header-invest {
      display: flex !important;
      align-items: baseline;
      gap: 5px;
      font-size: 9px;
      line-height: 1.25;

    .oh5-invest-label {
      font-weight: 700;

    }

    .oh5-invest-value {
      color: var(--oh5-ink);
      font-weight: 600;
      word-break: break-word;
      overflow-wrap: anywhere;

    /* ================= CATEGORY & TEST HEADINGS ================= */
    .oh5-category-section { margin-bottom: 7px; }

    .oh5-category-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      border-bottom: 1px solid var(--oh5-border);

      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;

    /* ================= RESULTS TABLE: CENTERED COLUMNS WITH LEFT-ALIGNED ROW TEXT ================= */
    .oh5-results-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      margin: 0 0 5px 0;

    }

    .oh5-param-row td:first-child { padding-left: 14px; }

    .oh5-param-indent {

    .oh5-test-title { font-weight: 400; color: #1e293b; }

    .oh5-method-note {
      display: block;
      margin-top: 0.5px;

    /* Centered column container, left-aligned text + straight H/L column */
    .oh5-col-result-cell { text-align: center !important; font-weight: 400; }
    .oh5-unit-cell { text-align: center !important; color: #475569; font-weight: 400; }
    .oh5-ref-block { text-align: center !important; color: #475569; font-weight: 400; }

    .oh5-result-header-inner,
    .oh5-result-wrap {
      display: grid;

      align-items: center;
      column-gap: 6px;
      width: 112px;
      max-width: 100%;
      margin: 0 auto;
      text-align: left !important;
    }

    .oh5-result-value {
      font-weight: 400;
      color: #1e293b;
      text-align: left !important;
      display: block;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }

    .oh5-flag-slot {
      width: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .HL {

    }

    /* Routine normal rows remain unbolded & unhighlighted */
    tr.oh5-test-row.is-normal-row td,
    tr.oh5-test-row.is-normal-row .oh5-test-title,
    tr.oh5-test-row.is-normal-row .oh5-result-value,
    tr.oh5-test-row.is-normal-row .oh5-unit-cell,
    tr.oh5-test-row.is-normal-row .oh5-unit-inner,
    tr.oh5-test-row.is-normal-row .oh5-ref-block,
    tr.oh5-test-row.is-normal-row .oh5-ref-text {

      background-color: transparent !important;
    }

    /* Full-row clinical alert highlighting exclusively for out-of-range / abnormal findings */
    tr.oh5-row--abnormal td {
      background-color: rgba(254, 226, 226, 0.72);
      border-bottom-color: #fecaca;
      color: #7f1d1d;
    }

    }

    tr.oh5-row--abnormal.is-red-row .oh5-unit-cell,
    tr.oh5-row--abnormal.is-red-row .oh5-unit-inner,
    tr.oh5-row--abnormal.is-red-row .oh5-ref-block,
    tr.oh5-row--abnormal.is-red-row .oh5-ref-text {

    .oh5-end-of-report {
      margin: 8px 0 4px 0;

      font-size: 8.8px;
      font-weight: 600;
      letter-spacing: 0.14em;
      color: var(--oh5-muted);

    }

    .oh5-end-of-report::before,
    .oh5-end-of-report::after {
      content: "";
      display: inline-block;
      width: 50px;
      height: 1px;
      background: var(--oh5-border);
      vertical-align: middle;
      margin: 0 10px;
    }

    /* ================= FOOTER / SIGNATURES (CLEAN, NO LINE BELOW) ================= */
    .oh5-footer-wrap {
      width: 100%;
      border-top: 1px solid var(--oh5-border);
      padding-top: 5px;
    }

    .oh5-footer-top-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

    .oh5-qr-block {
      width: 76px;
      max-width: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 2px;
      padding: 3px 4px;
      border: 1px solid var(--oh5-border-soft);
      border-radius: 4px;
      background: var(--oh5-bg-soft);
      flex-shrink: 0;
    }

    .oh5-qr-block img,
    #qrimg {
      width: 44px;
      height: 44px;
      display: block;
      object-fit: contain;
      background: #ffffff;
    }

    .oh5-qr-caption { width: 100%; line-height: 1.15; }

    .oh5-qr-title {
      display: block;
      font-size: 6.8px;
      font-weight: 700;
      color: var(--oh5-navy);

    .oh5-sign-img-wrap {
      height: 36px;

      justify-content: center;
      margin-bottom: 3px;
    }

    .oh5-sign-img {
      max-height: 35px;
      max-width: 125px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .oh5-sign-name {
      display: block;
      font-size: 9.2px;

      color: var(--oh5-ink);
      line-height: 1.2;
    }

    .oh5-sign-role {
      display: block;

      line-height: 1.2;
    }

    .oh5-footer-bottom-meta {
      margin-top: 4px;
      padding-top: 3px;
      border-top: 1px solid var(--oh5-border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 7.8px;
      color: var(--oh5-muted);
    }

    .oh5-page-counter {
      font-weight: 600;
      color: #334155;
      font-variant-numeric: tabular-nums;
    }

    /* ================= FLOATING ACTION DOCK ================= */
    .download-pdf-div.oh5-dock {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 950;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 6px;
      width: max-content;
      max-width: calc(100vw - 16px);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.28);
      box-sizing: border-box;
    }

    @media (min-width: 1025px) {
      .content-box:not(.collapsed) .download-pdf-div.oh5-dock {
        left: calc(50% + (var(--sidebar-width, 260px) / 2));
        max-width: calc(100vw - var(--sidebar-width, 260px) - 24px);
      }
    }

    .oh5-dock .downloadDiv {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      margin: 0;
      padding: 0;
    }

    .download-pdf-div.oh5-dock button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 29px;
      min-height: 29px;
      max-height: 29px;
      margin: 0;
      padding: 0 10px;
      border: none;
      border-radius: 999px;
      font-family: inherit;
      font-size: 11.2px;
      font-weight: 600;
      line-height: 1;
      letter-spacing: 0.01em;
      cursor: pointer;
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.11);
      transition: transform 0.14s ease, background 0.14s ease, opacity 0.14s ease;
      white-space: nowrap;
      flex-shrink: 0;
      vertical-align: middle;
      box-sizing: border-box;
    }

    .download-pdf-div.oh5-dock button i {
      font-size: 11px;
      line-height: 1;
      width: 12px;
      height: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      flex-shrink: 0;
    }

    .download-pdf-div.oh5-dock button .oh5-btn-label { display: inline-block; line-height: 1; margin: 0; }

    .oh5-count-badge {
      height: 15px;
      min-width: 15px;
      padding: 0 4px;
      margin-left: 2px;
      font-size: 9px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.24);
      color: #ffffff;
      font-weight: 700;
    }

    .download-pdf-div.oh5-dock button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .download-pdf-div.oh5-dock button:disabled { opacity: 0.48; cursor: not-allowed; }
    .download-pdf-div.oh5-dock #signOff.is-signed { background: #059669; color: #ffffff; }
    .download-pdf-div.oh5-dock #downloadPDF { background: #2563eb; color: #ffffff; }
    .download-pdf-div.oh5-dock #downloadPDF:hover:not(:disabled) { background: #1d4ed8; }
    .download-pdf-div.oh5-dock #BrowserPrint { background: #0f766e; color: #ffffff; }
    .download-pdf-div.oh5-dock #BrowserPrint:hover:not(:disabled) { background: #0d9488; }

    .oh5-dock .loading-overlay {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .oh5-dock .lo {
      width: 13px;
      height: 13px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: oh5Spin 0.7s linear infinite;
    }

    @keyframes oh5Spin { to { transform: rotate(360deg); } }

    @media (max-width: 1180px) and (min-width: 1025px) {
      .download-pdf-div.oh5-dock { gap: 3px; padding: 3px 5px; }
      .download-pdf-div.oh5-dock button { padding: 0 8px; font-size: 10.5px; gap: 4px; }
    }

    @media (max-width: 820px) {
      .oh5-viewport { overflow-x: auto; align-items: flex-start; }
      .download-pdf-div.oh5-dock { gap: 4px; padding: 4px 6px; }
      .download-pdf-div.oh5-dock button {
        padding: 0 9px;
        height: 30px;
        min-height: 30px;
        max-height: 30px;
        gap: 3px;
      }
      .download-pdf-div.oh5-dock button .oh5-btn-label { display: none; }
    }

    @media print {
      @page { size: A4; margin: 0; }
      body * { visibility: visible; }
      .oh5-page-root { background: #ffffff !important; padding-bottom: 0 !important; min-height: auto !important; }
      .no-print, .oh5-topbar, .oh5-dock, .oh5-modal, .oh5-toast-stack, .oh5-skeleton-wrap { display: none !important; }
      .oh5-viewport { padding: 0 !important; }
      .oh5-sheet-stack { gap: 0 !important; }
      .oh5-sheet {
        box-shadow: none !important;
        border-radius: 0 !important;
        page-break-after: always;
        break-after: page;
      }
      .oh5-sheet:last-child { page-break-after: auto; break-after: auto; }
      .cell-edit { background: transparent !important; box-shadow: none !important; padding: 0 !important; }
    }
  </style>

  <!-- Sticky Top Context Bar -->
