<!DOCTYPE html>
<html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>report format</title>

<head>
    <title>Lab Report</title>
    <link href="/vendor/fontawesome/css/all.min.css" rel="stylesheet" />
    <link href="/vendor/quill/quill.snow.css" rel="stylesheet">
    <style id="stying">
        * {
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
            box-sizing: border-box;
        }

        table {
            table-layout: fixed;
            width: 100%;
        }

        #reportFormat1Root {
            position: relative;
            isolation: isolate;
            background: #e2e8f0;
            min-height: 100vh;
            padding: 16px 16px 84px;
            --rf1-font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            --rf1-body-font-size: 13px;
            --rf1-row-pad-y: 6.5px;
        }

        .page-boot-loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: #f3f6fb;
            z-index: 20;
            overflow: hidden;
            padding: 0;
            opacity: 1;
            transition: opacity 220ms ease;
        }

        .page-boot-loader.is-hiding {
            opacity: 0;
            pointer-events: none;
        }

        .page-boot-shell {
            width: min(1180px, calc(100vw - 24px));
            margin: 0;
            padding: 14px;
            border-radius: 10px;
            background: #ffffff;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }

        .page-boot-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
        }

        .page-boot-block {
            border-radius: 8px;
            background: linear-gradient(100deg, #eef2f8 30%, #f8fbff 45%, #eef2f8 60%);
            background-size: 300% 100%;
            animation: skeleton-shimmer 1.2s ease-in-out infinite;
        }

        .page-boot-title {
            width: 210px;
            height: 30px;
        }

        .page-boot-pill {
            width: 200px;
            height: 28px;
            border-radius: 999px;
        }

        .page-boot-meta {
            margin-top: 14px;
            padding: 10px 10px 8px;
            border: 1px solid #b6b6b6;
            border-radius: 0;
            background: #fff;
        }

        .page-boot-meta-grid {
            display: grid;
            grid-template-columns: 42% 34% 24%;
            gap: 12px;
            align-items: start;
        }

        .page-boot-left-col,
        .page-boot-mid-col {
            min-height: 124px;
        }

        .page-boot-left-col {
            padding-right: 10px;
        }

        .page-boot-mid-col {
            padding: 0 10px;
            border-left: 1px solid #8f8f8f;
            border-right: 1px solid #8f8f8f;
        }

        .page-boot-meta-line {
            height: 12px;
        }

        .page-boot-meta-line.long {
            width: 100%;
        }

        .page-boot-meta-line.mid {
            width: 72%;
        }

        .page-boot-meta-line.small {
            width: 48%;
        }

        .page-boot-left-col,
        .page-boot-mid-col {
            display: grid;
            gap: 8px;
        }

        .page-boot-mid-col {
            padding-top: 2px;
        }

        .page-boot-kv {
            display: grid;
            grid-template-columns: 36% 64%;
            gap: 8px;
            align-items: center;
        }

        .page-boot-kv .label {
            height: 8px;
            width: 92%;
        }

        .page-boot-kv .value {
            height: 8px;
            width: 100%;
        }

        .page-boot-kv .value.strong {
            width: 56%;
            height: 12px;
        }

        .page-boot-barcode {
            width: 132px;
            height: 44px;
            border-radius: 4px;
            justify-self: start;
        }

        .page-boot-mid-title {
            width: 74%;
            height: 11px;
            margin-top: 2px;
        }

        .page-boot-qr-col {
            width: 100%;
            display: grid;
            gap: 6px;
            justify-items: center;
            align-content: start;
            padding-left: 8px;
        }

        .page-boot-qr-box {
            width: 116px;
            height: 102px;
            border-radius: 4px;
        }

        .page-boot-qr-text {
            width: 74px;
            height: 7px;
        }

        .page-boot-table {
            margin-top: 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }

        .page-boot-table-head {
            height: 34px;
            background: #e6ebf3;
        }

        .page-boot-table-row {
            display: grid;
            grid-template-columns: 36% 15% 12% 37%;
            gap: 10px;
            padding: 10px 12px;
            border-top: 1px solid #eef2f7;
        }

        .page-boot-cell {
            height: 12px;
        }

        .page-boot-footer {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            gap: 18px;
        }

        .page-boot-sign {
            flex: 1;
            border: 1px dashed #d6dee9;
            border-radius: 8px;
            padding: 12px;
        }

        .page-boot-sign-line {
            width: 64%;
            height: 14px;
            margin-bottom: 10px;
        }

        .page-boot-sign-meta {
            width: 90%;
            height: 10px;
            margin-top: 8px;
        }

        .page-boot-text {
            margin-top: 14px;
            text-align: center;
            font: 600 14px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4b5563;
            letter-spacing: 0.2px;
        }

        @keyframes skeleton-shimmer {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        @media screen and (max-width:900px) {
            .page-boot-meta-grid {
                grid-template-columns: 1fr;
            }

            .page-boot-table-row {
                grid-template-columns: 1fr 1fr;
            }

            .page-boot-footer {
                flex-direction: column;
            }
        }

        @media print {
            .page-boot-loader {
                display: none !important;
            }
        }

        .container-format1 {
            width: 100%;
            max-width: 960px;
            height: auto;
            margin: 4px auto 1rem auto;
            background-color: #ffffff;
            padding: 28px 34px 36px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-shadow: 0 12px 34px rgba(15, 23, 42, 0.12);
            font-family: var(--rf1-font-family, 'Segoe UI', Arial, Helvetica, sans-serif);
            color: #0f172a;
            overflow: visible;
        }

        .container22 {
            width: 100%;
            min-width: 0;
        }

        .badge {
            background-color: #e8f0fe;
            color: #1a73e8;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 600;
        }

        .report-details {
            width: 100%;
            margin: 0 0 28px 0;
        }

        /* Strictly locked 10px Header Card matching A4 clinical proportions */
        .report-details-innerDiv2 {
            position: relative;
            width: 100%;
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            border: 1px solid #cbd5e1;
            border-top: 2.5px solid #1e3a5f;
            border-radius: 4px;
            background: #f8fafc;
            padding: 0;
            overflow: hidden;
        }

        .report-details-innerDiv2,
        .report-details-innerDiv2 *,
        .report-details-innerDiv2 .format1left2,
        .report-details-innerDiv2 .format1left2 *,
        .report-details-innerDiv2 .format1-right2,
        .report-details-innerDiv2 .format1-right2 *,
        .report-details-innerDiv2 .qr-div,
        .report-details-innerDiv2 .qr-div * {
            font-size: 10px !important;
            line-height: 1.35 !important;
        }

        .format1left2 {
            flex: 1.05 1 0;
            min-width: 0;
            width: auto;
            padding: 9px 13px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3.5px;
        }

        .format1-right2 {
            position: static;
            transform: none;
            height: auto;
            flex: 1.08 0 308px;
            border-left: 1px solid #cbd5e1;
            padding: 9px 13px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            background: #ffffff;
        }

        .rf1-header-invest {
            width: 100%;
            display: flex;
            align-items: flex-start;
            gap: 6px;
            padding-top: 4px;
            margin-top: 2px;
            border-top: 1px dashed #cbd5e1;
        }

        .rf1-invest-label {
            width: 78px;
            min-width: 78px;
            flex-shrink: 0;
            font-weight: 700;
            color: #0f766e;
            white-space: nowrap;
        }

        .rf1-invest-value {
            flex: 1 1 auto;
            min-width: 0;
            color: #0f172a;
            font-weight: 600;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .rf1-barcode-band {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-bottom: 5px;
            margin-bottom: 2px;
            border-bottom: 1px dashed #cbd5e1;
        }

        .barcode-div2,
        .barcode2,
        #barcodeContainer2 {
            display: flex;
            align-items: center;
            margin: 0;
            padding: 0;
            border: none;
            background: transparent;
        }

        .rf1-accession-id {
            font-weight: 700;
            color: #1e3a5f;
            letter-spacing: 0.02em;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .format1-registeration-tag2 {
            width: 78px;
            min-width: 78px;
            flex-shrink: 0;
            font-weight: 600;
            color: #475569;
            display: block;
            white-space: nowrap;
        }

        .format1-registered-div2 {
            width: 100%;
            display: flex;
            align-items: baseline;
            gap: 6px;
            padding: 0;
            margin: 0;
        }

        .format1-time-div {
            flex: 1 1 auto;
            width: auto;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 6px;
            color: #0f172a;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        .format1-tags {
            width: 82px;
            min-width: 82px;
            flex-shrink: 0;
            font-weight: 600;
            color: #475569;
            white-space: nowrap;
        }

        #barcodeImage {
            display: block;
            width: 118px;
            height: 24px;
            object-fit: fill;
            margin: 0;
            background: transparent;
        }

        .footer {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
        }

        table.test-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            margin-bottom: 0;
            font-variant-numeric: tabular-nums;
        }

        table.test-table thead {
            background-color: #eef2f7;
        }

        table.test-table thead th {
            background-color: #eef2f7;
            color: #1e3a5f;
            font-size: calc(var(--rf1-body-font-size, 13px) - 0.5px);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 7px 10px;
            border-top: 1.5px solid #334155;
            border-bottom: 1.5px solid #334155;
            text-align: left;
            vertical-align: middle;
        }

        table.test-table th.deletion,
        table.test-table td.wrong {
            width: 26px;
            padding: 4px 2px !important;
            text-align: center;
            vertical-align: middle;
        }

        table.test-table th.col-test,
        table.test-table th:nth-child(2),
        table.test-table td.test-name {
            width: 37%;
            text-align: left;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        table.test-table th.valuecell,
        table.test-table th.col-val,
        table.test-table th:nth-child(3),
        table.test-table td.high-low {
            width: 22%;
            text-align: left;
            padding-left: 10px !important;
        }

        table.test-table th.col-unit,
        table.test-table th:nth-child(4),
        table.test-table td.unit-cell,
        table.test-table td:nth-child(4) {
            width: 14%;
            text-align: left;
        }

        table.test-table th.col-ref,
        table.test-table th:nth-child(5),
        table.test-table td.reference-cell,
        table.test-table td:nth-child(5) {
            width: 27%;
            text-align: left;
            white-space: pre-line;
            word-break: break-word;
            line-height: 1.35;
        }

        .unit i,
        .reference i {
            margin-left: 10px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Bottom button bar ── */
        .download-pdf-div {
            display: flex;
            flex-wrap: wrap;
            margin-top: 1rem;
            box-shadow: 0 -5px 10px rgba(0, 0, 0, 0.3);
            position: fixed;
            z-index: 100;
            bottom: 0px;
            width: 100%;
            background-color: white;
            padding: 4px 0;
        }

        .downloadDiv {
            margin: 4px 4px;
            position: relative;
            width: fit-content;
            border-radius: 5px;
            overflow: hidden;
        }

        /* common button style */
        .downloadDiv button {
            position: relative;
            overflow: hidden;
            padding: 6px 10px;
            font-weight: 600;
            font-size: 0.82rem;
            box-shadow: 1px 1px 6px 1px rgba(46, 46, 46, 0.2);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
        }

        .downloadDiv button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.14);
        }

        .downloadDiv button i {
            font-size: 1rem;
        }

        .button-count-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            padding: 0 7px;
            margin-left: 4px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.12);
            color: #0f172a;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        #viewPDF .button-count-badge,
        #downloadPDF .button-count-badge {
            background: rgba(239, 68, 68, 0.14);
            color: #991b1b;
        }

        #sendReport .button-count-badge {
            background: rgba(22, 163, 74, 0.16);
            color: #166534;
        }

        #BrowserPrint .button-count-badge,
        #PDFsetting .button-count-badge,
        #signOff .button-count-badge {
            background: rgba(71, 85, 105, 0.16);
            color: #334155;
        }

        .downloadDiv button::after,
        .input-container button::after {
            content: "";
            position: absolute;
            left: -35%;
            bottom: 0;
            width: 35%;
            height: 3px;
            background: linear-gradient(90deg, #22c55e 0%, #38bdf8 55%, #2563eb 100%);
            border-radius: 999px;
            opacity: 0;
            pointer-events: none;
        }

        .downloadDiv button.is-busy::after,
        .input-container button.is-busy::after {
            opacity: 1;
            animation: button-progress-slide 1.15s ease-in-out infinite;
        }

        .downloadDiv button.is-busy,
        .input-container button.is-busy {
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);
        }

        .downloadDiv button:disabled,
        .input-container button:disabled {
            opacity: 0.84;
            cursor: not-allowed;
        }

        #signOff {
            background-color: #00b7ffb0;
        }

        #signOff i {
            color: rgb(48, 48, 48);
        }

        #viewPDF {
            background-color: #ffe9e9;
        }

        #viewPDF i {
            color: rgba(255, 0, 0, 0.7);
        }

        #downloadPDF i {
            color: rgba(255, 0, 0, 0.7);
        }

        #sendReport {
            background-color: #2bff0066;
        }

        #sendReport i {
            color: #20b801;
        }

        #BrowserPrint i {
            color: #555;
        }

        #PDFsetting i {
            color: #555;
        }

        #loadingOverlay {
            display: none !important;
        }

        .format-loader {
            width: 20px;
            height: 20px;
            border: 4px solid #fff;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes button-progress-slide {
            0% {
                left: -35%;
                width: 24%;
                opacity: 0.35;
            }

            50% {
                left: 28%;
                width: 42%;
                opacity: 1;
            }

            100% {
                left: 100%;
                width: 24%;
                opacity: 0.4;
            }
        }

        .action-feedback-message {
            position: fixed;
            left: 50%;
            bottom: 76px;
            transform: translateX(-50%);
            min-width: 260px;
            max-width: min(88vw, 640px);
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.4;
            box-shadow: 0 14px 32px rgba(15, 23, 42, 0.18);
            backdrop-filter: blur(10px);
            display: none;
            z-index: 160;
        }

        .action-feedback-message[data-state="success"] {
            display: block;
            color: #166534;
            background: rgba(240, 253, 244, 0.96);
            border: 1px solid rgba(34, 197, 94, 0.22);
        }

        .action-feedback-message[data-state="error"] {
            display: block;
            color: #991b1b;
            background: rgba(254, 242, 242, 0.97);
            border: 1px solid rgba(239, 68, 68, 0.22);
        }

        .action-feedback-message[data-state="info"] {
            display: block;
            color: #1d4ed8;
            background: rgba(239, 246, 255, 0.97);
            border: 1px solid rgba(59, 130, 246, 0.22);
        }

        .popup-modal {
            display: none;
            position: fixed;
            z-index: 500;
            top: 0%;
            width: 80%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            overflow-y: scroll;
        }

        .popup-content {
            margin: auto;
            margin-top: 10rem;
            background: white;
            width: 100%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        .close-button {
            font-size: 30px;
            cursor: pointer;
            color: #333;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .popup-header button:not(.share-mode-button) {
            padding: 10px 15px;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .popup-header button:not(.share-mode-button):hover {
            background-color: #0056b3;
        }

        .share-buttons {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .share-heading {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .share-title {
            display: flex;
            align-items: center;
            font-weight: 700;
            color: #1f2937;
            font-size: 1.05rem;
        }

        .share-subtitle {
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
            color: #64748b;
        }

        .share-mode-switch {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .share-mode-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 14px;
            border: 1px solid #d7e2f0;
            border-radius: 999px;
            background: #f8fbff;
            color: #1f2937;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.86rem;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background-color .18s ease, color .18s ease;
        }

        .share-mode-button i {
            font-size: 0.95rem;
        }

        .share-mode-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(15, 23, 42, 0.08);
        }

        .share-mode-button.is-active[data-mode="whatsapp"] {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(22, 163, 74, 0.32);
            color: #166534;
        }

        .share-mode-button.is-active[data-mode="email"] {
            background: rgba(59, 130, 246, 0.11);
            border-color: rgba(37, 99, 235, 0.28);
            color: #1d4ed8;
        }

        .popup-header-actions {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .share-mode-hint {
            margin: 0 0 14px;
            padding: 12px 14px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(240, 249, 255, 0.92) 0%, rgba(236, 253, 245, 0.94) 100%);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #334155;
            font-size: 12.5px;
            font-weight: 600;
            line-height: 1.55;
        }

        .pdf-viewer {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .input-container {
            margin: 20px 0px 14px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-container input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #d7dee8;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: border-color .18s ease, box-shadow .18s ease;
        }

        .input-container input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
        }

        .input-container button {
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 165px;
            padding: 12px 16px;
            border: none;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;

            <div class="container22">
                <!-- <div class="header">
                    <h1>Lab Report</h1>
                    <span class="badge">booking Id. <span id="booking-registeration-number"></span></span>
                </div> -->
                <div class="report-details" style="width:100%;display:flex;justify-content:center;align-items:center;">
                </div>
                <div class="container2" id="containerpdf">
                    <div class="table-div" id="tables-container">
                        <div class="spinner-grow" role="status"><span class="sr-only">Loading...</span></div>
                    </div>
                </div>
                <h3 class="rf1-end-report">End of Report</h3>
            </div>
        </div>

        <div class="signed-off-div"></div>

        <!-- ── Bottom Action Bar ── -->
        <div class="download-pdf-div">

            <!-- Sign -->
            <div class="downloadDiv">
                <button id="signOff">
                    <i class="fa-solid fa-signature"></i><span>Sign</span>
                </button>
                <div id="loadingOverlay">
                    <div class="format-loader"></div>
                </div>
            </div>

            <!-- PDF -->
            <div class="downloadDiv">
                <button id="viewPDF" class="sign click">
                    <i class="fa-solid fa-file-pdf"></i><span>PDF</span>
                </button>
                <div id="loadingOverlay">
                    <div class="format-loader"></div>
                </div>
            </div>

            <!-- Download -->
            <div class="downloadDiv">
                <button id="downloadPDF" class="sign click">
                    <i class="fa-solid fa-file-pdf"></i><span>Download</span>
                </button>
                <div id="loadingOverlay">
                    <div class="format-loader"></div>
                </div>
            </div>

            <!-- Send -->
            <div class="downloadDiv">
                <button id="sendReport" class="sign click">
                    <i class="fa-solid fa-paper-plane"></i><span>Email Report</span>
                </button>
                <div id="loadingOverlay">
                    <div class="format-loader"></div>
                </div>
            </div>

            <!-- Browser Print -->
            <div class="downloadDiv">
                <button id="BrowserPrint" class="sign click">
                    <i class="fa-solid fa-print"></i><span>Browser</span>
                </button>
                <div id="loadingOverlay">
                    <div class="format-loader"></div>
                </div>
            </div>

            <!-- Settings -->
            <div class="downloadDiv" id="printsettingbutton">
                <a href="pages/pages/printsetting.html" id="PDFsettinganchr">
                    <button id="PDFsetting" class="sign click">
                        <i class="fa-solid fa-gear"></i><span>Setting</span>
                    </button>
                </a>
                <div id="loadingOverlay">
                    <div class="format-loader"></div>
                </div>
            </div>

        </div>

        <div id="actionFeedbackMessage" class="action-feedback-message" aria-live="polite"></div>

        <!-- Send Report Popup -->
        <div id="popupModal" class="popup-modal">
            <div class="popup-content">
                <div class="popup-header">
                    <div class="share-buttons">
                        <div class="share-heading">
                            <span id="shareTitle" class="share-title">Share Report</span>
                            <p class="share-subtitle">Preview the PDF below, then send it through WhatsApp or Email.</p>
                        </div>
                        <div class="share-mode-switch">
                            <button id="whatsappButton" class="share-mode-button" data-mode="whatsapp" type="button">
                                <i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span>
                            </button>
                            <button id="emailButton" class="share-mode-button" data-mode="email" type="button">
                                <i class="fa-solid fa-envelope"></i><span>Email</span>
                            </button>
                        </div>
                    </div>
                    <div class="popup-header-actions">
                        <button id="openPdfButton" type="button">Open PDF</button>
                        <div class="closeBtnDiv"><span class="close-button">&times;</span></div>
                    </div>
                </div>
                <p id="shareModeHint" class="share-mode-hint">A ready-to-send WhatsApp message with the report download
                    link will open in a new chat.</p>
                <div id="inputField" class="input-container">
                    <input id="contactInput" type="tel" inputmode="numeric" autocomplete="tel"
                        placeholder="Enter WhatsApp Number" />
                    <button id="sendButton" type="button" data-mode="whatsapp">
                        <i class="fa-brands fa-whatsapp"></i><span>Open WhatsApp</span>
                    </button>
                </div>
                <div id="emailStatusMessage" class="email-status-message" aria-live="polite"></div>
                <iframe id="pdfFrame" src="" class="pdf-viewer"></iframe>
            </div>
        </div>

        <script src="/vendor/jsbarcode/JsBarcode.all.min.js"></script>
        <script src="/vendor/html2pdf/html2pdf.bundle.min.js"></script>
        <script src="reportAction.shared.js"></script>
        <script src="reportFormat1.js"></script>
    </div>
</body>

</html>
