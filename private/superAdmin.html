    <style>
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --warning: #f72585;
            --danger: #e63946;
            --light: #f8f9fa;
            --dark: #212529;
            --gray: #6c757d;
            --sidebar-width: 250px;
            --header-height: 60px;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fb;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Styles */
        .sidebar {
            width: var(--sidebar-width);
            background: linear-gradient(180deg, var(--secondary) 0%, var(--primary) 100%);
            color: white;
            height: 100vh;
            position: fixed;
            transition: var(--transition);
            z-index: 1000;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            width: 156px;
            height: auto;
        }

        .sidebar-menu {
            padding: 20px 0;
        }

        .menu-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: var(--transition);
            border-left: 4px solid transparent;
        }

        .menu-item:hover,
        .menu-item.active {
            background-color: rgba(255, 255, 255, 0.1);
            border-left-color: var(--success);
        }

        .menu-item i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .menu-item span {
            flex: 1;
        }

        /* Main Content Styles */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: var(--transition);
        }

        .header {
            height: var(--header-height);
            background-color: white;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .toggle-sidebar {
            font-size: 20px;
            cursor: pointer;
            display: none;
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            position: relative;
            margin: 0 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border: 1px solid #ddd;
            border-radius: 30px;
            outline: none;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
        }

        .search-bar i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
        }

        .user-menu {
            display: flex;
            align-items: center;
        }

        .notification,
        .messages {
            position: relative;
            margin-right: 20px;
            cursor: pointer;
        }

        .notification i,
        .messages i {
            font-size: 18px;
            color: var(--gray);
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: var(--warning);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-profile {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: bold;
        }

        .user-avatar.user-avatar-image {
            object-fit: cover;
            padding: 0;
            border: 2px solid rgba(67, 97, 238, 0.18);
            background: rgba(67, 97, 238, 0.08);
        }

        .user-profile span {
            font-size: 14px;
            font-weight: 500;
        }

        /* Content Container */

        /* Responsive Styles */
        @media (max-width: 768px) {

            }

            .toggle-sidebar {
                display: block;
            }

            .user-profile span {
                display: none;
            }

        :root {
            --base_scale: 5vh;
            --floor: 15vh;
            --color: #836ee5;
        }

        *,
        *:before,
        *:after {
            box-sizing: border-box;
        }

        .loader {
            background: #eee;
            min-height: 100vh;
            width: 100%;
            padding-bottom: var(--floor);
            border-bottom: var(--floor) solid #fff;
            overflow-y: hidden;
            position: fixed;
            z-index: 1050;
            display: none;
        }

        .shape {
            position: absolute;
            display: block;
            left: 50%;
            bottom: 0;
            margin-left: calc(-1 * (var(--base_scale) / 2));
            margin-bottom: var(--floor);
        }

        .shape.circle {
            width: var(--base_scale);
            height: var(--base_scale);
            background: var(--color);
            border-radius: 50%;
        }

        .shape.semi-circle {
            height: calc(var(--base_scale) * 2);
            width: var(--base_scale);
            background: var(--color);
            border-bottom-right-radius: calc(var(--base_scale) * 2);
            border-top-right-radius: calc(var(--base_scale) * 2);
        }

        .shape.square {
            width: var(--base_scale);
            height: var(--base_scale);
            background: var(--color);
        }

        .shape.rectangle {
            width: calc(var(--base_scale) * 1.5);
            height: var(--base_scale);
            background: var(--color);
        }

        .shape.triangle {
            width: 0;
            height: 0;
            border-bottom: var(--base_scale) solid var(--color);
            border-right: var(--base_scale) solid transparent;
        }

        .shape.triangle-2 {
            width: 0;
            height: 0;
            border-top: var(--base_scale) solid var(--color);
            border-left: var(--base_scale) solid transparent;
        }

        .shape.bounce-up {
            --bounce-variance: 0vh;
            --bounce-height: calc(-1 * 50vh - calc(var(--base_scale) - var(--floor) + var(--bounce-variance)));
            transition: transform 400ms cubic-bezier(0.215, 0.61, 0.355, 1);
            transform: translateY(var(--bounce-height)) rotate(0deg);
        }

        .shape.bounce-down {
            transition: transform 300ms cubic-bezier(0.6, 0.04, 0.98, 0.335);
            transform: translateY(0) rotate(var(--rotation));
        }

        .main-content {
            padding: 0px;
        }

        .modal {
            position: fixed;
            top: 15%;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1050;
            display: none;
            overflow: hidden;
            outline: 0;
            height: 70vh;
        }

        /* Minimalist Global Top Progress Rail & Single Sidebar Spinner */
        .lf-instant-rail {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            z-index: 2147483647;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            overflow: hidden;
            background: rgba(67, 97, 238, 0.08);
        }

        .lf-instant-rail.is-active {
            opacity: 1;
        }

        .lf-instant-rail__bar {
            height: 100%;
            width: 100%;
            transform-origin: left center;
            transform: scaleX(var(--lf-rail-progress, 0.14));
            background: linear-gradient(90deg, #4361ee 0%, #38bdf8 52%, #3f37c9 100%);
            box-shadow: 0 0 10px rgba(67, 97, 238, 0.6);
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }

        .lf-instant-rail__bar::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.55) 50%, transparent 100%);
            animation: lfSaRailShimmer 1.2s linear infinite;
        }

        @keyframes lfSaRailShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes lfSaSpin { to { transform: rotate(360deg); } }

        .sidebar .menu-item.is-route-loading {
            background-color: rgba(255, 255, 255, 0.16);
        }

        .sidebar .lf-nav-pending-spinner {
            margin-left: auto;
            width: 14px;
            height: 14px;
            flex: 0 0 14px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.32);
            border-top-color: #ffffff;
            animation: lfSaSpin 0.65s linear infinite;
        }

        .lf-snapshot-stage {
            position: relative;
            width: 100%;
            pointer-events: none;
            user-select: none;
        }

        .lf-snapshot-stage .lf-snapshot-canvas {
            display: block;
            max-width: 100%;
        }

        .lf-workspace-skeleton {
            display: grid;
            gap: 16px;
        }

        .lf-skel-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 20px;
        }

        .lf-skel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
        }

        .lf-skel-line {
            height: 12px;
            border-radius: 999px;
            background: linear-gradient(90deg, #e2e8f0 0%, #f1f5f9 50%, #e2e8f0 100%);
            background-size: 200% 100%;
            animation: lfSaSkeletonWave 1.4s ease-in-out infinite;
        }

        .lf-skel-line--lg { height: 20px; width: 42%; }
        .lf-skel-line--md { height: 14px; width: 65%; }
        .lf-skel-line--sm { height: 11px; width: 35%; }
        .lf-skel-block { height: 220px; border-radius: 12px; }

        @keyframes lfSaSkeletonWave {
            0% { background-position: 100% 50%; }
            100% { background-position: -100% 50%; }
        }

        .lf-route-toast-host {
            position: fixed;
            right: 20px;
            bottom: 20px;
            z-index: 2147483645;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: min(400px, calc(100vw - 24px));
            pointer-events: none;
        }

        .lf-route-toast {
            pointer-events: auto;
            display: flex;
            align-items: flex-start;
            gap: 11px;
            padding: 13px 14px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid #fecaca;
            border-left: 4px solid #dc2626;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.16);
            color: #0f172a;
        }

        .lf-route-toast__icon {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: #fef2f2;
            color: #dc2626;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .lf-route-toast__body { flex: 1; min-width: 0; }
        .lf-route-toast__title { font-size: 13px; font-weight: 700; margin: 0 0 2px; }
        .lf-route-toast__msg { font-size: 12px; color: #64748b; margin: 0; line-height: 1.4; }
        .lf-route-toast__actions { display: flex; gap: 8px; margin-top: 9px; }
        .lf-route-toast__btn {
            padding: 5px 11px;
            border-radius: 7px;
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #334155;
        }
        .lf-route-toast__btn--primary {
            background: #4361ee;
            border-color: #4361ee;
            color: #ffffff;
        }
        .lf-route-toast__close {
            border: 0;
            background: transparent;
            color: #94a3b8;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
    </style>
</head>

    <!-- Synchronous Pre-Paint Snapshot & Buffer Hydration -->
    <script>
        (function () {
            try {
                var SNAPSHOT_KEY = "lf_spa_snapshot_superadmin";
                var params = new URLSearchParams(window.location.search);
                var targetPage = params.get("page") || "dashboard";
                var escapeAttr = function (v) {
                    var s = String(v || "");
                    return (window.CSS && typeof window.CSS.escape === "function")
                        ? window.CSS.escape(s)
                        : s.replace(/["\\]/g, "");
                };
                var rail = document.getElementById("lfInstantRail");
                var mainContent = document.getElementById("main-content");

                var setInitialProgress = function (pct) {
                    var clamped = Math.max(8, Math.min(95, pct));
                    var ratio = (clamped / 100).toFixed(3);
                    document.documentElement.style.setProperty("--lf-rail-progress", ratio);
                };

                var attachSingleSidebarSpinner = function (pageKey) {
                    var sidebarEl = document.getElementById("sidebar");
                    if (!sidebarEl || !pageKey) return;
                    var candidate = sidebarEl.querySelector('.menu-item[data-page="' + escapeAttr(pageKey) + '"]');
                    if (!candidate) return;
                    candidate.classList.add("is-route-loading");
                    candidate.setAttribute("aria-busy", "true");
                    if (!candidate.querySelector(".lf-nav-pending-spinner")) {
                        var sp = document.createElement("span");
                        sp.className = "lf-nav-pending-spinner";
                        sp.setAttribute("aria-hidden", "true");
                        candidate.appendChild(sp);
                    }
                };

                var raw = null;
                try { raw = sessionStorage.getItem(SNAPSHOT_KEY); } catch (e) {}
                var snapshot = null;
                if (raw) {
                    try { snapshot = JSON.parse(raw); } catch (e) { snapshot = null; }
                }

                var isValidSnapshot = Boolean(
                    snapshot &&
                    snapshot.pathname === window.location.pathname &&
                    typeof snapshot.contentHtml === "string" &&
                    snapshot.contentHtml.trim().length > 0 &&
                    (!snapshot.ts || (Date.now() - Number(snapshot.ts)) < 15 * 60 * 1000)
                );

                if (isValidSnapshot && mainContent) {
                    var activeSnapshotPage = snapshot.page || targetPage;
                    document.querySelectorAll(".menu-item").forEach(function (el) {
                        el.classList.remove("active");
                    });
                    document.querySelectorAll('.menu-item[data-page="' + escapeAttr(activeSnapshotPage) + '"]').forEach(function (el) {
                        el.classList.add("active");
                    });

                    var stage = document.createElement("div");
                    stage.className = "lf-snapshot-stage";
                    stage.setAttribute("data-lf-snapshot", "true");
                    stage.setAttribute("aria-hidden", "true");
                    try { stage.inert = true; } catch (e) {}
                    stage.innerHTML = snapshot.contentHtml;
                    mainContent.innerHTML = "";
                    mainContent.appendChild(stage);
                    window.__lfHasBootSnapshot = true;

                    if (snapshot.scrollY) {
                        requestAnimationFrame(function () {
                            window.scrollTo(0, Number(snapshot.scrollY) || 0);
                        });
                    }
                } else if (mainContent) {
                    mainContent.innerHTML =
                        '<div class="lf-workspace-skeleton" data-lf-boot-skeleton="true" aria-hidden="true">' +
                        '<div class="lf-skel-card"><div class="lf-skel-line lf-skel-line--lg"></div><div class="lf-skel-line lf-skel-line--sm" style="margin-top:10px;"></div></div>' +
                        '<div class="lf-skel-grid">' +
                        '<div class="lf-skel-card"><div class="lf-skel-line lf-skel-line--sm"></div><div class="lf-skel-line lf-skel-line--md" style="margin-top:12px;"></div></div>' +
                        '<div class="lf-skel-card"><div class="lf-skel-line lf-skel-line--sm"></div><div class="lf-skel-line lf-skel-line--md" style="margin-top:12px;"></div></div>' +
                        '<div class="lf-skel-card"><div class="lf-skel-line lf-skel-line--sm"></div><div class="lf-skel-line lf-skel-line--md" style="margin-top:12px;"></div></div>' +
                        '</div>' +
                        '<div class="lf-skel-card"><div class="lf-skel-line lf-skel-block"></div></div>' +
                        '</div>';
                }

                attachSingleSidebarSpinner(targetPage);
                if (rail) rail.classList.add("is-active");
                setInitialProgress(14);

                var bootPct = 14;
                window.__lfBootProgress = bootPct;
                window.__lfBootProgressTimer = window.setInterval(function () {
